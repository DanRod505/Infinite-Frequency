<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Frequency</title>
    <!-- Inline so the page is never a blank white screen, even if the bundle fails to load. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a0630;
        color: #f4eaff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      .boot h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-shadow: 0 0 16px #ff4fd8;
      }
      .boot p {
        max-width: 520px;
        margin: 0 auto;
        line-height: 1.5;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="boot" id="boot">
      <h1>Infinite Frequency</h1>
      <p id="boot-message">Carregando…</p>
    </div>
    <noscript>
      <div class="boot"><p>Ative o JavaScript para jogar Infinite Frequency.</p></div>
    </noscript>
    <script>
      // Classic script (runs even where the module bundle cannot): if the game has not
      // started after a while, explain instead of leaving a silent loading screen.
      window.setTimeout(function () {
        if (window.__infiniteFrequencyBooted) return;
        var message = document.getElementById('boot-message');
        if (message && !window.__infiniteFrequencyFailed) {
          message.innerHTML =
            'O jogo não conseguiu iniciar.<br />Recarregue a página ignorando o cache ' +
            '(<b>Ctrl+Shift+R</b>, ou <b>Cmd+Shift+R</b> no Mac). Se persistir, use uma versão ' +
            'recente do Chrome, Edge, Firefox ou Safari.';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
